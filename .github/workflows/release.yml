name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一标签的 GitHub 制品串行发布；npm 由 npm-publish.yml 的 OIDC 流程独立发布。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org/

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Validate release version and channel
        id: package
        # Tag 是发布版本的唯一来源，构建时同步 package.json 和 package-lock.json。
        run: |
          version="${GITHUB_REF_NAME#v}"
          node - "$version" <<'NODE'
          const { appendFileSync } = require('node:fs');
          const pkg = require('./package.json');
          const { validateRelease } = require('./scripts/package-version');
          const version = process.argv[2];
          validateRelease(version, pkg.publishConfig?.tag, 'latest');
          if (pkg.name !== '@qfeius/everyline-cli') throw new Error('npm 包名不匹配');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nchannel=${pkg.publishConfig.tag}\n`);
          NODE
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Test, build and verify installation
        run: make release-check

      - name: Publish native GitHub release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package CLI and Skills
        run: |
          # GoReleaser 清理 dist 后，重新生成独立 Skill 导入包。
          make skill-assets
          node scripts/pack-release.js .

      - name: Attach npm and Skill packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: gh release upload "$GITHUB_REF_NAME" "everyline-cli-${RELEASE_VERSION}.tgz" dist/*-skill.zip --clobber
